name: strongR-frida-build

# Build hluda-server (strongR-frida patched) for android-arm64 on GitHub Actions.
# Fork of CrackerCat/strongR-frida-android, rewritten to:
#  - pin a Frida version (no latest, no release/secret deps)
#  - clone public hluwa/Patchs (no PATCH_REPO secret)
#  - drop the frida-gum `git am` step whose empty glob hung `git am` on stdin
#  - only build arm64
#  - upload via actions/upload-artifact (upload-release-asset was removed by GitHub)
#
# Trigger manually: gh workflow run build.yml -f frida_version=17.11.0

on:
  workflow_dispatch:
    inputs:
      frida_version:
        description: 'Frida release tag to build (e.g. 17.11.0)'
        required: true
        default: '17.11.0'

jobs:
  android_build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        arch: [arm64]
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android NDK
      id: setup-ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25b

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        sudo apt-get update
        DEBIAN_FRONTEND=noninteractive sudo apt-get install -y \
          build-essential tree ninja-build \
          gcc-multilib g++-multilib lib32stdc++-9-dev \
          flex bison ruby ruby-dev \
          python3-requests python3-setuptools python3-dev python3-pip \
          libc6-dev libc6-dev-i386 \
          valac libglib2.0-dev
        sudo gem install fpm -v 1.11.0 --no-document
        python3 -m pip install lief graphlib

    - name: Clone hluwa/Patchs (public, no secret)
      shell: bash
      run: |
        git clone --depth 1 https://github.com/hluwa/Patchs Patchs
        echo "=== core patches present ==="
        ls -1 Patchs/strongR-frida/frida-core/*.patch

    - name: Clone Frida at pinned tag + submodules
      shell: bash
      run: |
        git config --global user.name "gitAction"
        git config --global user.email "gitAction@gmail.com"
        VER="${{ inputs.frida_version }}"
        git clone https://github.com/frida/frida frida
        cd frida
        # checkout the release tag, then sync submodules to that tag
        git checkout "$VER" 2>/dev/null || git checkout "tags/$VER"
        git submodule update --init --recursive
        echo "=== frida checked out at: $(git describe --tags 2>/dev/null || git rev-parse --short HEAD) ==="

    - name: Apply strongR-frida core patches (with 3way fallback)
      shell: bash
      run: |
        cd frida/subprojects/frida-core
        # detached HEAD in a submodule is fine for `git am`
        if git am --3way ../../../Patchs/strongR-frida/frida-core/*.patch; then
          echo "=== git am applied cleanly ==="
        else
          echo "=== git am failed, aborting and retrying with git apply --3way ==="
          git am --abort 2>/dev/null || true
          git apply --3way ../../../Patchs/strongR-frida/frida-core/*.patch && echo "=== git apply OK ==="
        fi

    - name: Configure
      shell: bash
      run: |
        export ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}
        cd frida
        ./configure --host=android-${{ matrix.arch }} --enable-portal -- -Dfrida-gum:devkits=gum,gumjs -Dfrida-core:devkits=core

    - name: Compile
      run: make

    - name: Package arm64 outputs
      shell: bash
      run: |
        pushd frida
        xz -T0 build/frida-android-arm64/bin/frida-server
        xz -T0 build/frida-android-arm64/bin/frida-inject
        xz -T0 build/frida-android-arm64/lib/frida/64/frida-gadget.so
        popd
        ls -la frida/build/frida-android-arm64/bin/*.xz frida/build/frida-android-arm64/lib/frida/64/*.xz

    - name: Upload hluda-server artifact
      uses: actions/upload-artifact@v4
      with:
        name: hluda-android-arm64-${{ inputs.frida_version }}
        retention-days: 30
        path: |
          frida/build/frida-android-arm64/bin/frida-server.xz
          frida/build/frida-android-arm64/bin/frida-inject.xz
          frida/build/frida-android-arm64/lib/frida/64/frida-gadget.so.xz