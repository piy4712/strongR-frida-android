name: strongR-frida-build

# Build hluda-server (strongR-frida patched) for android-arm64 on GitHub Actions.
#
# This is a port of hluwa/strongR-frida (2021, Frida 15) to Frida 17.x. The
# original .patch files no longer `git am` cleanly because Frida 17 refactored:
#   - embed-agent.sh -> embed-agent.py (Python)
#   - fifo-based linjector -> memfd-based (0003 no longer applies)
#   - gmain is GLib locale data, not a Frida thread name (0007 unnecessary)
#
# Instead of git am, strongr_port.py applies the equivalent detection-string
# changes directly to the checked-out source. patch_agent.py (lief + sed) is
# hooked into embed-agent.py to patch each built agent .so before it is packed.
#
# Trigger: gh workflow run build.yml -f frida_version=17.11.0

on:
  workflow_dispatch:
    inputs:
      frida_version:
        description: 'Frida release tag to build (e.g. 17.11.0)'
        required: true
        default: '17.11.0'

jobs:
  android_build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        arch: [arm64]
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android NDK
      id: setup-ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25b

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        sudo apt-get update
        DEBIAN_FRONTEND=noninteractive sudo apt-get install -y \
          build-essential tree ninja-build \
          gcc-multilib g++-multilib lib32stdc++-9-dev \
          flex bison ruby ruby-dev \
          python3-requests python3-setuptools python3-dev python3-pip \
          libc6-dev libc6-dev-i386 \
          valac libglib2.0-dev
        sudo gem install fpm -v 1.11.0 --no-document
        python3 -m pip install lief graphlib

    - name: Clone Frida at pinned tag + submodules
      shell: bash
      run: |
        git config --global user.name "gitAction"
        git config --global user.email "gitAction@gmail.com"
        VER="${{ inputs.frida_version }}"
        git clone https://github.com/frida/frida frida
        cd frida
        git checkout "$VER" 2>/dev/null || git checkout "tags/$VER"
        git submodule update --init --recursive
        echo "=== frida at: $(git describe --tags 2>/dev/null || git rev-parse --short HEAD) ==="
        echo "=== frida-core at: $(cd subprojects/frida-core && git describe --tags 2>/dev/null) ==="
        echo "=== frida-gum at: $(cd subprojects/frida-gum && git describe --tags 2>/dev/null) ==="

    - name: Apply strongR source patches (port to 17.x)
      shell: bash
      run: |
        cp strongr_port.py frida/strongr_port.py
        cp patch_agent.py frida/patch_agent.py
        cd frida
        python3 strongr_port.py
        echo "=== verify patches landed ==="
        grep -n "Base64.decode" subprojects/frida-core/lib/base/rpc.vala | head
        grep -n "Uuid.string_random" subprojects/frida-core/server/server.vala | head
        grep -rn "frida-agent" subprojects/frida-core/src/linux/linux-host-session.vala | head
        grep -n "gum-js-loop" subprojects/frida-gum/bindings/gumjs/gumscriptscheduler.c || echo "gum-js-loop replaced OK"

    - name: Hook patch_agent.py into embed-agent.py
      shell: bash
      run: |
        cd frida/subprojects/frida-core
        # Insert a call to patch_agent.py right after each shutil.copy(agent, embedded_agent)
        # in the linux/android branch, before the resource_compiler packs them.
        python3 - <<'PY'
        from pathlib import Path
        p = Path("src/embed-agent.py")
        s = p.read_text()
        anchor = '            shutil.copy(agent, embedded_agent)'
        hook = (
            '            shutil.copy(agent, embedded_agent)\n'
            '            import subprocess as _sp; _sp.run(["python3", "../../../../patch_agent.py", str(embedded_agent)], check=False)'
        )
        if anchor not in s:
            raise SystemExit("anchor shutil.copy(agent, embedded_agent) not found in embed-agent.py")
        s = s.replace(anchor, hook, 1)
        p.write_text(s)
        print("hooked patch_agent.py into embed-agent.py (linux/android branch)")
        PY

    - name: Configure
      shell: bash
      run: |
        export ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}
        cd frida
        ./configure --host=android-${{ matrix.arch }} --enable-portal -- -Dfrida-gum:devkits=gum,gumjs -Dfrida-core:devkits=core

    - name: Compile
      run: make

    - name: Verify agent was patched (symbol check)
      shell: bash
      run: |
        # The built agent .so should NOT export frida_agent_main / any frida* symbol.
        AGENT=$(find frida/build/frida-android-arm64 -name 'frida-agent-64.so' -o -name 'frida-agent.so' 2>/dev/null | head -1)
        echo "agent: ${AGENT:-not found}"
        if [ -n "$AGENT" ]; then
          echo "=== exported symbols containing frida/gum/FRIDA ==="
          nm -D "$AGENT" 2>/dev/null | grep -iE "frida|gum" | head -20 || echo "NONE (good)"
          echo "=== rodata strings containing frida/gum-js-loop ==="
          strings "$AGENT" | grep -iE "frida|gum-js-loop|gmain" | head -20 || echo "NONE (good)"
        fi

    - name: Package arm64 outputs
      shell: bash
      run: |
        pushd frida
        xz -T0 build/frida-android-arm64/bin/frida-server
        xz -T0 build/frida-android-arm64/bin/frida-inject
        xz -T0 build/frida-android-arm64/lib/frida/64/frida-gadget.so
        popd
        ls -la frida/build/frida-android-arm64/bin/*.xz frida/build/frida-android-arm64/lib/frida/64/*.xz

    - name: Upload hluda-server artifact
      uses: actions/upload-artifact@v4
      with:
        name: hluda-android-arm64-${{ inputs.frida_version }}
        retention-days: 30
        path: |
          frida/build/frida-android-arm64/bin/frida-server.xz
          frida/build/frida-android-arm64/bin/frida-inject.xz
          frida/build/frida-android-arm64/lib/frida/64/frida-gadget.so.xz