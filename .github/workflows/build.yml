name: strongR-frida-build

# Build hluda-server (strongR-frida patched) for android-arm64 on GitHub Actions.
#
# This is a port of hluwa/strongR-frida (2021, Frida 15) to Frida 17.x. The
# original .patch files no longer `git am` cleanly because Frida 17 refactored:
#   - embed-agent.sh -> embed-agent.py (Python)
#   - fifo-based linjector -> memfd-based (0003 no longer applies)
#   - gmain is GLib locale data, not a Frida thread name (0007 unnecessary)
#
# Instead of git am, strongr_port.py applies the equivalent detection-string
# changes directly to the checked-out source. patch_agent.py (lief + sed) is
# hooked into embed-agent.py to patch each built agent .so before it is packed.
#
# Trigger: gh workflow run build.yml -f frida_version=17.11.0

on:
  workflow_dispatch:
    inputs:
      frida_version:
        description: 'Frida release tag to build (e.g. 17.11.0)'
        required: true
        default: '17.11.0'

jobs:
  android_build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        arch: [arm64]
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android NDK
      id: setup-ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r29

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        sudo apt-get update
        DEBIAN_FRONTEND=noninteractive sudo apt-get install -y \
          build-essential tree ninja-build \
          gcc-multilib g++-multilib lib32stdc++-9-dev \
          flex bison ruby ruby-dev \
          python3-requests python3-setuptools python3-dev python3-pip \
          libc6-dev libc6-dev-i386 \
          valac libglib2.0-dev
        sudo gem install fpm -v 1.11.0 --no-document
        python3 -m pip install lief graphlib

    - name: Clone Frida at pinned tag + submodules
      shell: bash
      run: |
        git config --global user.name "gitAction"
        git config --global user.email "gitAction@gmail.com"
        VER="${{ inputs.frida_version }}"
        git clone https://github.com/frida/frida frida
        cd frida
        git checkout "$VER" 2>/dev/null || git checkout "tags/$VER"
        git submodule update --init --recursive
        echo "=== frida at: $(git describe --tags 2>/dev/null || git rev-parse --short HEAD) ==="
        echo "=== frida-core at: $(cd subprojects/frida-core && git describe --tags 2>/dev/null) ==="
        echo "=== frida-gum at: $(cd subprojects/frida-gum && git describe --tags 2>/dev/null) ==="

    - name: Apply strongR source patches (port to 17.x)
      shell: bash
      run: |
        cp strongr_port.py frida/strongr_port.py
        cp patch_agent.py frida/patch_agent.py
        cd frida
        python3 strongr_port.py
        echo "=== verify patches landed (old detection strings must be GONE) ==="
        ! grep -q '"frida:rpc"' subprojects/frida-core/lib/base/rpc.vala || { echo "rpc: frida:rpc still present"; exit 1; }
        ! grep -q 're.frida.server' subprojects/frida-core/server/server.vala || { echo "server: re.frida.server still present"; exit 1; }
        ! grep -rq 'frida-agent' subprojects/frida-core/src/linux/linux-host-session.vala || { echo "agent name: frida-agent still present in linux-host-session"; exit 1; }
        ! grep -q 'gum-js-loop' subprojects/frida-gum/bindings/gumjs/gumscriptscheduler.c || { echo "gum-js-loop still present"; exit 1; }
        ! grep -q '"frida-agent-emulated"' subprojects/frida-core/lib/agent/agent.vala || { echo "frida-agent-emulated thread name still present"; exit 1; }
        ! grep -q '"frida-eternal-agent"' subprojects/frida-core/lib/agent/agent.vala || { echo "frida-eternal-agent thread name still present"; exit 1; }
        ! grep -q '"frida-agent-container"' subprojects/frida-core/src/agent-container.vala || { echo "frida-agent-container thread name still present"; exit 1; }
        ! grep -q 'refused to load frida-agent' subprojects/frida-core/src/host-session-service.vala || { echo "host-session-service msg still present"; exit 1; }
        ! grep -q '"frida-main-loop"' subprojects/frida-core/src/frida-glue.c || { echo "frida-main-loop thread name still present"; exit 1; }
        echo "all source patches verified OK"

    - name: Hook patch_agent.py into embed-agent.py
      shell: bash
      run: |
        cd frida/subprojects/frida-core
        # Hook patch_agent.py into the LINUX/ANDROID branch of embed-agent.py
        # (the one that runs for our android-arm64 build). There are 3 copies of
        # shutil.copy(agent, embedded_agent): windows (12-space), linux/android
        # (16-space, inside `for agent, flavor`), freebsd/qnx (8-space). Hook ALL
        # of them defensively so whichever branch runs, the agent gets patched.
        cp ../../../patch_agent.py src/patch_agent.py
        python3 - <<'PY'
        from pathlib import Path
        p = Path("src/embed-agent.py")
        s = p.read_text()
        anchor = '            shutil.copy(agent, embedded_agent)'
        hook_line = (
            '            shutil.copy(agent, embedded_agent)\n'
            '            import subprocess as _sp, sys as _sys; _r=_sp.run([_sys.executable, str(Path(__file__).resolve().parent / "patch_agent.py"), str(embedded_agent)], capture_output=True, text=True); print("[patch_agent]", _r.stdout, _r.stderr, file=_sys.stderr); _r.check_returncode()'
        )
        # the linux/android branch copy is indented 16 spaces (inside for loop)
        anchor_linux = '                shutil.copy(agent, embedded_agent)'
        hook_linux = (
            '                shutil.copy(agent, embedded_agent)\n'
            '                import subprocess as _sp, sys as _sys; _r=_sp.run([_sys.executable, str(Path(__file__).resolve().parent / "patch_agent.py"), str(embedded_agent)], capture_output=True, text=True); print("[patch_agent]", _r.stdout, _r.stderr, file=_sys.stderr); _r.check_returncode()'
        )
        n = 0
        if anchor in s:
            s = s.replace(anchor, hook_line, 1); n += 1
        if anchor_linux in s:
            s = s.replace(anchor_linux, hook_linux, 1); n += 1
        if n == 0:
            raise SystemExit("no shutil.copy(agent, embedded_agent) anchor found in embed-agent.py")
        p.write_text(s)
        print(f"hooked patch_agent.py into embed-agent.py ({n} branches: windows + linux/android)")
        PY

    - name: Configure
      shell: bash
      run: |
        export ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}
        cd frida
        ./configure --host=android-${{ matrix.arch }} --enable-portal -- -Dfrida-gum:devkits=gum,gumjs -Dfrida-core:devkits=core

    - name: Compile
      shell: bash
      run: |
        export ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}
        cd frida
        make

    - name: Verify agent was patched (symbol check, non-fatal)
      shell: bash
      run: |
        set +e
        # The built agent .so should NOT export frida_agent_main / any frida* symbol.
        AGENT=$(find frida/build -type f \( -name 'frida-agent-64.so' -o -name 'frida-agent.so' -o -name '*-agent-64.so' -o -name 'libfrida-agent*.so' \) 2>/dev/null | head -1)
        echo "agent: ${AGENT:-not found}"
        if [ -n "$AGENT" ]; then
          echo "=== exported symbols containing frida/gum/FRIDA ==="
          nm -D "$AGENT" 2>/dev/null | grep -iE "frida|gum" | head -20
          echo "(empty above = good)"
          echo "=== rodata strings containing frida/gum-js-loop/gmain ==="
          strings "$AGENT" | grep -iE "frida|gum-js-loop|gmain" | head -20
          echo "(empty above = good)"
        fi
        echo "verify step done (non-fatal)"
        exit 0

    - name: Package arm64 outputs
      shell: bash
      run: |
        set +e
        # Frida 17 meson builds directly in frida/build (cross via cross-file,
        # no per-host subdir). Outputs live under subprojects/frida-core/...
        BD=frida/build
        echo "=== locate built outputs under $BD ==="
        SERVER=$(find "$BD/subprojects/frida-core/server" -maxdepth 1 -type f -name 'frida-server' ! -name '*.*' 2>/dev/null | head -1)
        INJECT=$(find "$BD/subprojects/frida-core/inject" -maxdepth 1 -type f -name 'frida-inject' ! -name '*.*' 2>/dev/null | head -1)
        GADGET=$(find "$BD/subprojects/frida-core/lib/gadget" -maxdepth 1 -type f -name 'frida-gadget' ! -name '*.*' 2>/dev/null | head -1)
        echo "server: ${SERVER:-NOT FOUND}"
        echo "inject: ${INJECT:-NOT FOUND}"
        echo "gadget: ${GADGET:-NOT FOUND}"
        # fallback: search whole build tree
        [ -z "$SERVER" ] && SERVER=$(find "$BD" -type f -name 'frida-server' ! -name '*.*' 2>/dev/null | grep -E 'server/frida-server$' | head -1)
        [ -z "$INJECT" ] && INJECT=$(find "$BD" -type f -name 'frida-inject' ! -name '*.*' 2>/dev/null | grep -E 'inject/frida-inject$' | head -1)
        [ -z "$GADGET" ] && GADGET=$(find "$BD" -type f -name 'frida-gadget' ! -name '*.*' 2>/dev/null | grep -E 'gadget/frida-gadget$' | head -1)
        echo "after fallback -> server: ${SERVER:-NOT FOUND} | inject: ${INJECT:-NOT FOUND} | gadget: ${GADGET:-NOT FOUND}"
        # stage into a clean dist dir matching the expected layout
        mkdir -p dist/bin dist/lib/frida/64
        [ -n "$SERVER" ] && cp "$SERVER" dist/bin/frida-server
        [ -n "$INJECT" ] && cp "$INJECT" dist/bin/frida-inject
        [ -n "$GADGET" ] && cp "$GADGET" dist/lib/frida/64/frida-gadget.so
        echo "=== staged dist ==="
        ls -la dist/bin dist/lib/frida/64
        echo "=== xz ==="
        xz -T0 dist/bin/frida-server dist/bin/frida-inject dist/lib/frida/64/frida-gadget.so 2>/dev/null || true
        ls -la dist/bin/*.xz dist/lib/frida/64/*.xz 2>/dev/null
        # fail only if frida-server missing (the one we actually need)
        [ -f dist/bin/frida-server.xz ] || { echo "ERROR: frida-server not built/found"; find "$BD" -name 'frida-server*' 2>/dev/null | head; exit 1; }
        exit 0

    - name: Upload hluda-server artifact
      uses: actions/upload-artifact@v4
      with:
        name: hluda-android-arm64-${{ inputs.frida_version }}
        retention-days: 30
        path: |
          dist/bin/frida-server.xz
          dist/bin/frida-inject.xz
          dist/lib/frida/64/frida-gadget.so.xz